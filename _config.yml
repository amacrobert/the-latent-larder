title: The Latent Larder
email:
# The meta description search engines quote under the result. Kept under ~155
# characters, because past that they truncate it mid-thought.
description: >-
  Recipes written to be checked rather than trusted: ingredients in one column,
  method in the other, and no life story before the flour.
url: "https://thelatentlarder.com"
baseurl: ""
lang: en

# The zone recipe timestamps are read in when they don't name one themselves.
# Recipes carry a full `date: 2026-07-29 18:03:11 -0400` so that same-day ones
# list in the order they were published, and an explicit offset needs no help
# from this. But without it a date written without an offset would be read in
# the build machine's zone — the container's here, UTC on GitHub Actions — which
# is a different instant, and near midnight a different day, depending on where
# the site was built.
timezone: America/New_York

# No `author:` here on purpose. jekyll-seo-tag would turn a string into a
# schema.org Person, and the larder is not one — the recipe schema names it as
# an Organization instead, which is both true and what a publisher should be.

# The home page <title> is built as "title | tagline". Without a tagline it
# falls back to the description, which made a ~100-character title that search
# results cut off. This also stands in as the masthead line.
tagline: Recipes from the latent space

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Content pages live here. `output: true` is what actually generates a page
# per file; without it the collection is readable but never rendered.
collections:
  recipes:
    output: true
    permalink: /recipes/:path/

# So a recipe file never has to declare `layout:` itself.
defaults:
  - scope:
      path: ""
      type: "recipes"
    values:
      layout: "recipe"
      # jekyll-seo-tag defaults anything with a `date` to BlogPosting. These
      # are not blog posts, and leaving it would put a BlogPosting node next to
      # the Recipe node in `_includes/recipe-schema.html` — two different
      # claims about what the page is. WebPage is the neutral, true one.
      seo:
        type: WebPage

# How many recipe cards a list page holds before it splits, on the home page
# and on each tag page alike. Read by _plugins/pagination.rb — jekyll-paginate
# is not installed, and would only ever paginate `posts` if it were.
paginate: 60

# Pages listed in the site header, in order.
header_pages:
  - about.md

# The dry aside about how these recipes get written. Rendered in the footer
# and, in short form, as a stamp on every recipe.
colophon:
#  stamp: "machine-written"
#  line: "Every recipe here was written by a machine that has never been hungry. Cooked, we hope, by someone who is."

exclude:
  - assets/images/originals/
  # Authoring scripts. These were being copied into _site and served, which is
  # crawlable surface that is not a page.
  - bin/
  - Gemfile
  - Gemfile.lock
  - Dockerfile
  - docker-compose.yml
  - .dockerignore
  - README.md
  - vendor/
  - .github/
  - .idea/
  - .sass-cache/
  - .jekyll-cache/
